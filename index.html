<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Emre Okucu - Mechanical Engineering Journey</title>

  <link href="https://unpkg.com/vis-timeline@latest/styles/vis-timeline-graph2d.min.css" rel="stylesheet" type="text/css" />
  <script src="https://unpkg.com/vis-timeline@latest/standalone/umd/vis-timeline-graph2d.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f0f4f9;
      --surface: #ffffff;
      --text: #1a2a3a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --panel-w: 380px;
      --accent: #2563eb;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      color: var(--text);
      transition: margin-right 0.4s cubic-bezier(0.4,0,0.2,1);
    }

    body.panel-open {
      margin-right: var(--panel-w);
    }

    .page-header {
      text-align: center;
      padding: 48px 20px 36px;
    }

    .page-header h1 {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      font-weight: 400;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .page-header p {
      margin-top: 8px;
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 300;
    }

    .timeline-wrapper {
      max-width: 1100px;
      margin: 0 auto;
      background: var(--surface);
      padding: 28px 28px 24px;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
      margin-bottom: 32px;
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .zoom-controls {
      display: flex;
      gap: 8px;
    }

    .btn {
      padding: 7px 16px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      border-radius: 8px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.15s;
    }

    .btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: #eff6ff;
    }

    .hint {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hint::before {
      content: '';
      display: inline-block;
      width: 8px; height: 8px;
      background: var(--accent);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.4); }
    }

    #emre-timeline {
      height: 280px;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
    }

    .vis-item { border-radius: 4px !important; border: none !important; }
    .vis-item.vis-selected { border: 2px solid rgba(0,0,0,0.3) !important; box-shadow: 0 0 0 3px rgba(37,99,235,0.25) !important; }
    .vis-item .vis-item-content { color: white; font-weight: 500; font-size: 0.75rem; padding: 4px 6px; }

    #legend {
      margin-top: 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    #legend span {
      padding: 4px 10px;
      border-radius: 20px;
      color: white;
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
      white-space: nowrap;
    }

    #legend span:hover { transform: translateY(-1px); opacity: 0.85; }

    /* ─── Side Panel ─── */
    #detail-panel {
      position: fixed;
      top: 0; right: 0;
      width: var(--panel-w);
      height: 100vh;
      background: var(--surface);
      border-left: 1px solid var(--border);
      box-shadow: -8px 0 32px rgba(0,0,0,0.08);
      transform: translateX(100%);
      transition: transform 0.4s cubic-bezier(0.4,0,0.2,1);
      display: flex;
      flex-direction: column;
      z-index: 1000;
      overflow: hidden;
    }

    #detail-panel.open {
      transform: translateX(0);
    }

    .panel-header {
      padding: 20px 20px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      gap: 12px;
      flex-shrink: 0;
    }

    .panel-color-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      margin-top: 5px;
      flex-shrink: 0;
    }

    .panel-title-block { flex: 1; min-width: 0; }

    .panel-title {
      font-family: 'DM Serif Display', serif;
      font-size: 1.2rem;
      font-weight: 400;
      line-height: 1.3;
      color: var(--text);
    }

    .panel-subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 3px;
      font-weight: 300;
    }

    .panel-close {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 1.3rem;
      line-height: 1;
      padding: 2px;
      border-radius: 4px;
      transition: color 0.15s;
      flex-shrink: 0;
    }

    .panel-close:hover { color: var(--text); }

    .panel-body {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
    }

    .panel-meta {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .meta-chip {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .meta-chip svg { opacity: 0.6; }

    .section-label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .task-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .task-list li {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 0.88rem;
      line-height: 1.5;
      color: var(--text);
    }

    .task-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      margin-top: 7px;
      flex-shrink: 0;
    }

    .panel-tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 20px;
    }

    .tag {
      padding: 3px 10px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 500;
      background: #f1f5f9;
      color: #475569;
    }

    .gpa-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 10px;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
      font-size: 0.85rem;
      font-weight: 500;
      margin-top: 16px;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 16px 0;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .empty-state svg { margin-bottom: 12px; opacity: 0.3; }
    .empty-state p { font-size: 0.9rem; }

    @media (max-width: 640px) {
      :root { --panel-w: 100vw; }
      body.panel-open { margin-right: 0; }
      .timeline-wrapper { padding: 16px; }
    }
  </style>
</head>
<body>

<div class="page-header">
  <h1>Emre Okucu</h1>
  <p>Mechanical Engineering Journey · 2009 – Present</p>
</div>

<div class="timeline-wrapper" style="margin: 0 20px 32px; max-width: 1100px; margin-left: auto; margin-right: auto;">
  <div class="controls-row">
    <div class="zoom-controls">
      <button class="btn" onclick="myTimeline.zoomIn(0.5)">＋ Zoom In</button>
      <button class="btn" onclick="myTimeline.zoomOut(0.5)">－ Zoom Out</button>
      <button class="btn" onclick="myTimeline.fit()">Fit All</button>
    </div>
    <div class="hint">Click any item to see details</div>
  </div>
  <div id="emre-timeline"></div>
  <div id="legend"></div>
</div>

<!-- Detail Panel -->
<div id="detail-panel">
  <div class="panel-header">
    <div class="panel-color-dot" id="panel-dot"></div>
    <div class="panel-title-block">
      <div class="panel-title" id="panel-title">—</div>
      <div class="panel-subtitle" id="panel-type">—</div>
    </div>
    <button class="panel-close" onclick="closePanel()" title="Close">✕</button>
  </div>
  <div class="panel-body" id="panel-body">
    <div class="empty-state">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>
      <p>Select an item</p>
    </div>
  </div>
</div>

<div style="max-width:1100px; margin: 0 auto 48px; padding: 0 20px; display:flex; gap:12px; flex-wrap:wrap;">
  <a href="https://drive.google.com/drive/folders/1kwkYefz5b4DYYv4ixHtxmBHX0D42jGnw?usp=sharing" target="_blank" style="display:inline-flex; align-items:center; gap:8px; padding:10px 20px; background:#2563eb; color:white; border-radius:10px; font-family:'DM Sans',sans-serif; font-size:0.88rem; font-weight:500; text-decoration:none; box-shadow:0 2px 8px rgba(37,99,235,0.3); transition:opacity 0.15s;" onmouseover="this.style.opacity='0.85'" onmouseout="this.style.opacity='1'">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
    Photos of my previous work
  </a>
  <a href="mailto:emreokucu@gmail.com" style="display:inline-flex; align-items:center; gap:8px; padding:10px 20px; background:white; color:#2563eb; border:1px solid #bfdbfe; border-radius:10px; font-family:'DM Sans',sans-serif; font-size:0.88rem; font-weight:500; text-decoration:none; transition:opacity 0.15s;" onmouseover="this.style.opacity='0.75'" onmouseout="this.style.opacity='1'">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
    emreokucu@gmail.com
  </a>
</div>

<script>
  const companyColors = {
    'Marmara University':               '#1f77b4',
    'Istanbul Technical University':    '#ff7f0e',
    'Balikesir University':             '#2ca02c',
    'Akın Agricultural Machinery':      '#d62728',
    'Azimli Agricultural Equipments':   '#9467bd',
    'Özkan Metal':                      '#8c564b',
    'Esan Mining':                      '#e377c2',
    'GENBA Machinery':                  '#7f7f7f',
    'Turkish Aerospace (TUSAŞ)':        '#17becf',
    'On Machinery':                     '#8dbdff',
    'Open to Opportunities':            '#aec7e8'
  };

  // Detail data for panel
  const detailData = {
    1: {
      type: 'Education',
      period: 'Sep 2009 – Jun 2011',
      duration: '1 yr 9 mo',
      tasks: [
        'Started BSc program in Mechanical Engineering',
        'Achieved strong academic performance with a GPA of 3.76',
        'Earned transfer eligibility to Istanbul Technical University'
      ],
      tags: ['BSc', 'GPA 3.76', 'Transfer'],
      gpa: '3.76'
    },
    2: {
      type: 'Education',
      period: 'Sep 2011 – Jun 2014',
      duration: '2 yrs 9 mo',
      tasks: [
        'Completed BSc in Mechanical Engineering',
        'Received the Best Final Project Award at graduation',
      ],
      tags: ['BSc', 'GPA 2.61', 'Best Final Project Award'],
      gpa: '2.61'
    },
    3: {
      type: 'Education',
      period: 'Sep 2014 – Jun 2016',
      duration: '1 yr 9 mo',
      tasks: [
        'Completed MSc in Mechanical Engineering',
        'Published research on rapid prototyping using MRI scan data',
      ],
      tags: ['MSc', 'GPA 3.66', 'Publication', '3D Printing'],
      gpa: '3.66'
    },
    4: {
      type: 'Work Experience',
      period: 'Oct 2014 – Aug 2017',
      duration: '2 yrs 10 mo',
      tasks: [
        'Operated and programmed CNC metal machining equipment (lathe and plasma cutter)',
        'Designed agricultural machinery including trailers, feed mixers, vacuum trucks, and loaders',
        'Led a KOSGEB-funded R&D project: designed, manufactured, and certified a log loader',
        'Optimized manufacturing processes to reduce costs'
      ],
      tags: ['CNC', 'Design', 'R&D', 'KOSGEB', 'Agricultural Machinery']
    },
    5: {
      type: 'Work Experience',
      period: 'Sep 2017 – Dec 2017',
      duration: '4 mo',
      tasks: [
        'Set up, operated, and maintained a CNC plasma cutter',
        'Created CAD files for plasma-cut manufactured parts',
        'Trained staff on CNC plasma cutter operation'
      ],
      tags: ['CNC Plasma', 'Maintenance', 'Training']
    },
    6: {
      type: 'Work Experience',
      period: 'Apr 2018 – May 2018',
      duration: '2 mo',
      tasks: [
        'Set up, operated, and maintained a CNC plasma cutter',
        'Provided technical training to operator staff',
        'Created CAD files for plasma cutting'
      ],
      tags: ['CNC Plasma', 'Setup', 'Metal Fabrication']
    },
    7: {
      type: 'Work Experience',
      period: 'May 2018 – Aug 2019',
      duration: '1 yr 3 mo',
      tasks: [
        'Designed and analyzed mining equipment (scaler booms, drill rig pipe systems, excavator attachments)',
        'Performed hydraulic calculations and selected hydraulic components',
        'Executed manufacturing operations and obtained equipment certifications',
        'Carried out FEM-based structural strength analyses'
      ],
      tags: ['Mining', 'Hydraulics', 'FEM', 'Certification', 'Structural Analysis']
    },
    8: {
      type: 'Work Experience',
      period: 'Oct 2019 – Mar 2020',
      duration: '6 mo',
      tasks: [
        'Designed wind turbine maintenance platforms',
        'Managed pricing and quotation processes for Enercon wind turbines',
        'Performed structural load analyses'
      ],
      tags: ['Wind Energy', 'Structural Design', 'Pricing']
    },
    10: {
      type: 'Work Experience',
      period: 'Jun 2021 – Dec 2024',
      duration: '3 yrs 6 mo',
      tasks: [
        'Created finite element models (GFEM and DFEM) for aircraft structural components using Hypermesh, Patran, and Python',
        'Wrote custom analysis tools for processing SOL106 (geometric nonlinearity) data',
        'Pioneered SOL106 analyses to detect buckling, enabling thinner and lighter structures',
        'Post-processed FEA results and produced technical reports and presentations',
        'Performed hand calculations for stress analysis in line with aerospace standards',
        'Coordinated design revision cycles with engineering teams'
      ],
      tags: ['FEM/FEA', 'Structural Analysis', 'Aerospace', 'Python', 'Stress Analysis', 'TUSAŞ']
    },
    11: {
      type: 'Work Experience',
      period: 'Dec 2024 – Dec 2025',
      duration: '1 yr',
      tasks: [
        'Led engineering work on a CNC gantry-type mill built from concrete',
        'Produced all necessary mechanical designs for the machine',
        'Helped the company secure government R&D funding'
      ],
      tags: ['R&D', 'Machine Design', 'CNC', 'Government Grant']
    },
    12: {
      type: 'Status',
      period: 'Jan 2026 – Present',
      duration: 'Active',
      tasks: [
        'Open to engineering roles with a focus on structural analysis or software',
        'Available for international positions and relocation'
      ],
      tags: ['Open to Work', 'Structural Analysis', 'Engineering Software']
    }
  };

  const items = new vis.DataSet([
    { id: 1,  content: '', start: '2009-09', end: '2011-06', title: 'Marmara University', style: 'background-color:' + companyColors['Marmara University'] + ';', company: 'Marmara University' },
    { id: 2,  content: '', start: '2011-09', end: '2014-06', title: 'Istanbul Technical University', style: 'background-color:' + companyColors['Istanbul Technical University'] + ';', company: 'Istanbul Technical University' },
    { id: 3,  content: '', start: '2014-09', end: '2016-06', title: 'Balikesir University', style: 'background-color:' + companyColors['Balikesir University'] + ';', company: 'Balikesir University' },
    { id: 4,  content: '', start: '2014-10', end: '2017-08', title: 'Akın Agricultural Machinery', style: 'background-color:' + companyColors['Akın Agricultural Machinery'] + ';', company: 'Akın Agricultural Machinery' },
    { id: 5,  content: '', start: '2017-09', end: '2017-12', title: 'Azimli Agricultural Equipments', style: 'background-color:' + companyColors['Azimli Agricultural Equipments'] + ';', company: 'Azimli Agricultural Equipments' },
    { id: 6,  content: '', start: '2018-04', end: '2018-05', title: 'Özkan Metal', style: 'background-color:' + companyColors['Özkan Metal'] + ';', company: 'Özkan Metal' },
    { id: 7,  content: '', start: '2018-05', end: '2019-08', title: 'Esan Mining', style: 'background-color:' + companyColors['Esan Mining'] + ';', company: 'Esan Mining' },
    { id: 8,  content: '', start: '2019-10', end: '2020-03', title: 'GENBA Machinery', style: 'background-color:' + companyColors['GENBA Machinery'] + ';', company: 'GENBA Machinery' },
    { id: 10, content: '', start: '2021-06', end: '2024-12', title: 'Turkish Aerospace (TUSAŞ)', style: 'background-color:' + companyColors['Turkish Aerospace (TUSAŞ)'] + ';', company: 'Turkish Aerospace (TUSAŞ)' },
    { id: 11, content: '', start: '2024-12', end: '2025-12', title: 'On Machinery', style: 'background-color:' + companyColors['On Machinery'] + ';', company: 'On Machinery' },
    { id: 12, content: '', start: '2026-01', type: 'point', title: 'Open to Opportunities', style: 'background-color:' + companyColors['Open to Opportunities'] + ';', company: 'Open to Opportunities' }
  ]);

  const options = {
    width: '100%', height: '280px',
    stack: true, showMajorLabels: true, showMinorLabels: true,
    zoomable: true, moveable: true, selectable: true, editable: false,
    margin: { item: 10 }, orientation: 'top',
    tooltip: { followMouse: true }
  };

  const container = document.getElementById('emre-timeline');
  const myTimeline = new vis.Timeline(container, items, options);

  myTimeline.on('click', function(props) {
    if (props.item !== null) {
      const item = items.get(props.item);
      openPanel(props.item, item);
    }
  });

  function openPanel(id, item) {
    const data = detailData[id];
    if (!data) return;

    const color = companyColors[item.company] || '#888';
    document.getElementById('panel-dot').style.background = color;
    document.getElementById('panel-title').textContent = item.company;
    document.getElementById('panel-type').textContent = data.type + ' · ' + data.duration;

    let bodyHTML = '';

    // Meta chips
    bodyHTML += `<div class="panel-meta">
      <div class="meta-chip">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>
        ${data.period}
      </div>
    </div>`;

    // GPA badge if education
    if (data.gpa) {
      bodyHTML += `<div class="gpa-badge">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
        GPA ${data.gpa}
      </div>`;
    }

    bodyHTML += '<div class="divider"></div>';

    // Tasks
    bodyHTML += `<div class="section-label">Duties &amp; Responsibilities</div>`;
    bodyHTML += `<ul class="task-list">`;
    data.tasks.forEach(t => {
      bodyHTML += `<li><span class="task-dot" style="background:${color}"></span><span>${t}</span></li>`;
    });
    bodyHTML += `</ul>`;

    // Tags
    if (data.tags && data.tags.length) {
      bodyHTML += `<div class="panel-tag-row">`;
      data.tags.forEach(tag => {
        bodyHTML += `<span class="tag">${tag}</span>`;
      });
      bodyHTML += `</div>`;
    }

    document.getElementById('panel-body').innerHTML = bodyHTML;
    document.getElementById('detail-panel').classList.add('open');
    document.body.classList.add('panel-open');
    myTimeline.setSelection([id]);
  }

  function closePanel() {
    document.getElementById('detail-panel').classList.remove('open');
    document.body.classList.remove('panel-open');
    myTimeline.setSelection([]);
  }

  // Close on ESC
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });

  // Legend
  function selectCompany(company) {
    const matching = items.get({ filter: i => i.company === company });
    if (matching.length > 0) {
      myTimeline.setSelection(matching.map(i => i.id));
      myTimeline.fit({ ids: matching.map(i => i.id), animation: true });
      openPanel(matching[0].id, matching[0]);
    }
  }

  let legendHTML = '';
  Object.keys(companyColors).forEach(company => {
    legendHTML += `<span onclick="selectCompany('${company}')" style="background-color:${companyColors[company]};">${company}</span>`;
  });
  document.getElementById('legend').innerHTML = legendHTML;
</script>
</body>
</html>
